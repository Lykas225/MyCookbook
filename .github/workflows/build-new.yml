name: Build MyCookbook
on:
  workflow_dispatch:
  push:
    paths:
      - 'MyCookbook-source.zip'
      - '.github/workflows/build-new.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          mkdir /tmp/proj
          unzip -q MyCookbook-source.zip -d /tmp/proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: /tmp/proj
        run: gradle assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: MyCookbook-APK
          path: /tmp/proj/app/build/outputs/apk/debug/app-debug.apk
