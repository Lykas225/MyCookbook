name: Build MyCookbook
on:
  workflow_dispatch:
  push:
    paths:
      - 'MyCookbook-source*.zip'
      - '.github/workflows/build-new.yml'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: |
          ZIP=$(ls -t MyCookbook-source*.zip | head -n 1)
          echo "Using: $ZIP"
          mkdir -p /tmp/proj
          unzip -q "$ZIP" -d /tmp/proj
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build
        working-directory: /tmp/proj
        run: gradle assembleDebug --no-daemon --stacktrace -PappVersionCode=${{ github.run_number }} -PappVersionName=1.${{ github.run_number }}
      - name: Prepare APK
        run: cp /tmp/proj/app/build/outputs/apk/debug/app-debug.apk MyCookbook.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: MyCookbook v${{ github.run_number }}
          body: Новая версия MyCookbook
          files: MyCookbook.apk
